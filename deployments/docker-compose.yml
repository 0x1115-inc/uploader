services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network

  uploader:
    build: 
      context: ./
      dockerfile: build/Dockerfile
    environment:
      PORT: "8080"
      DB_PATH: "/data/uploader.db"
      MAX_UPLOAD_MB: "10" 
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "uploads"
      S3_USE_SSL: "false"
      LOG_LEVEL: "info"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - minio
    volumes:
      - uploader-data:/data
    networks:
      - app-network

volumes:
  minio-data:
  uploader-data:

networks:
  app-network: